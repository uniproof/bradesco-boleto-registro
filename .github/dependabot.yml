version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Maven APIs/SPIs follow the Maven runtime, not the application
      - dependency-name: "org.apache.maven:*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
