# Submits the fully resolved Maven dependency tree (including transitive
# dependencies) to GitHub's dependency graph, so Dependabot alerts cover
# everything the application actually ships, not only what pom.xml declares.
name: Dependency submission

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Private Uniproof artifacts live in GitHub Packages. PACKAGES_READ_TOKEN
      # (a token with read:packages) is preferred; the job token is the fallback
      # and only works for packages that grant this repository Actions access.
      - name: Write Maven settings for GitHub Packages
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: |
          repos="uniproof-java-service uniproof-back-connector arisp-integration document-processor uniproof-blockchain-services"
          {
            echo '<settings><activeProfiles><activeProfile>github</activeProfile></activeProfiles>'
            echo '<profiles><profile><id>github</id><repositories>'
            echo '<repository><id>central</id><url>https://repo1.maven.org/maven2</url></repository>'
            for r in $repos; do
              echo "<repository><id>github-$r</id><url>https://maven.pkg.github.com/uniproof/$r</url><snapshots><enabled>true</enabled></snapshots></repository>"
            done
            echo '</repositories></profile></profiles><servers>'
            # Same token for every id: the poms also declare these repositories as "github" / "github-back"
            for id in github github-back $(printf 'github-%s ' $repos); do
              echo '<server><id>'"$id"'</id><username>${{ github.actor }}</username><password>${env.PACKAGES_TOKEN}</password></server>'
            done
            echo '</servers></settings>'
          } > "$RUNNER_TEMP/dependency-settings.xml"

      - name: Submit dependency snapshot
        uses: advanced-security/maven-dependency-submission-action@v4.1.1
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        with:
          settings-file: ${{ runner.temp }}/dependency-settings.xml
          ignore-maven-wrapper: true
